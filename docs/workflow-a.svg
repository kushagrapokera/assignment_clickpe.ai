<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc"><title id="title">Workflow A · Loan product discovery</title><desc id="desc">Source registry → crawl → extract → canonical product catalogue.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a0a0a0"/></marker></defs>
<rect width="1040" height="410" rx="0" fill="#101010"/>
<text x="30" y="37" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#f2f2f2" font-weight="600">Workflow A · Loan product discovery</text>
<text x="30" y="64" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">Source registry → crawl → extract → canonical product catalogue.</text>
<rect x="30" y="105" width="290" height="100" rx="3" fill="#191919" stroke="#d0d0d0" stroke-width="1.5"/>
<text x="44" y="131" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d0d0d0" font-weight="600">1 · Trigger + source registry</text>
<text x="44" y="155" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">Cron: every 5 min in test profile</text>
<text x="44" y="175" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">Configured publisher URLs</text>
<rect x="375" y="105" width="290" height="100" rx="3" fill="#191919" stroke="#d0d0d0" stroke-width="1.5"/>
<text x="389" y="131" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d0d0d0" font-weight="600">2 · Fetch source pages</text>
<text x="389" y="155" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">HTTP requests to public pages</text>
<text x="389" y="175" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">Check expected page fingerprints</text>
<rect x="720" y="105" width="290" height="100" rx="3" fill="#191919" stroke="#d0d0d0" stroke-width="1.5"/>
<text x="734" y="131" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d0d0d0" font-weight="600">3 · Extract product facts</text>
<text x="734" y="155" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">Publisher-specific HTML / text parsers</text>
<text x="734" y="175" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">Retain published eligibility wording</text>
<rect x="720" y="255" width="290" height="100" rx="3" fill="#191919" stroke="#d0d0d0" stroke-width="1.5"/>
<text x="734" y="281" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d0d0d0" font-weight="600">4 · Canonicalize + fingerprint</text>
<text x="734" y="305" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">Collapse duplicate products</text>
<text x="734" y="325" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">Track changes to policy content</text>
<rect x="375" y="255" width="290" height="100" rx="3" fill="#191919" stroke="#d0d0d0" stroke-width="1.5"/>
<text x="389" y="281" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d0d0d0" font-weight="600">5 · Upsert catalogue</text>
<text x="389" y="305" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">PostgreSQL loan_products</text>
<text x="389" y="325" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">Preserve source and provenance</text>
<rect x="30" y="255" width="290" height="100" rx="3" fill="#191919" stroke="#d0d0d0" stroke-width="1.5"/>
<text x="44" y="281" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d0d0d0" font-weight="600">6 · Record crawl results</text>
<text x="44" y="305" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">Run logs and discovery snapshots</text>
<text x="44" y="325" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c6c6c6">Catalogue feeds matching</text>
<polyline points="320,155 375,155" fill="none" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="665,155 720,155" fill="none" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="865,205 865,255" fill="none" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="720,305 665,305" fill="none" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="375,305 320,305" fill="none" stroke="#a0a0a0" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="30" y="390" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#c6c6c6">Read left → right across the top row, then right → left across the bottom row.</text>
</svg>
